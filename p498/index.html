<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Overstock Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#f5f5f4; --card:#ffffff; --ink:#0a0a0a; --ink2:#262626; --muted:#737373; --faint:#a3a3a3;
  --line:#e7e5e4; --line2:#d6d3d1; --soft:#fafaf9;
  --ok:#15803d; --okbg:#ecfdf3; --okline:#bbf7d0;
  --warn:#b45309; --warnbg:#fffbeb; --warnline:#fde68a;
  --bad:#b91c1c; --badbg:#fef2f2; --badline:#fecaca;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-sm);border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;letter-spacing:.01em;transition:transform .05s,opacity .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.ghost.danger{background:#fff;color:var(--bad);border-color:var(--badline)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.xs{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn.block{width:100%}
.btn.lg{height:54px;font-size:16px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0}
.iconbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.input{width:100%;height:46px;padding:0 14px;border:1px solid var(--line2);border-radius:var(--r-sm);background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(10,10,10,.08)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#555 50%),linear-gradient(135deg,#555 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 500px at 50% -10%,#e7e5e4,transparent),var(--bg)}
.login-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 28px;box-shadow:var(--shadow)}
.brandmark{width:52px;height:52px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-.02em;font-size:18px}
.login-card h1{font-size:24px;letter-spacing:-.02em;margin:18px 0 4px}
.login-card p.sub{margin:0 0 26px;color:var(--muted)}
.field{margin-bottom:16px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:4px 0 10px}
.login-foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand .brandmark{width:34px;height:34px;border-radius:9px;font-size:12px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;font-weight:600;background:#fff;white-space:nowrap}
.pill.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(21,128,61,.5);animation:pulse 2s infinite}
.live.off{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,128,61,.45)}70%{box-shadow:0 0 0 7px rgba(21,128,61,0)}100%{box-shadow:0 0 0 0 rgba(21,128,61,0)}}
.userchip{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--soft);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

/* ---------- Tabs ---------- */
.tabs{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:14px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .count{font-size:11px;background:var(--soft);border:1px solid var(--line);padding:0 6px;border-radius:999px;color:var(--ink2)}

main{max-width:1280px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 2px 10px}

/* ---------- User: stats strip ---------- */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.strip .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.strip .s b{display:block;font-size:20px;letter-spacing:-.02em}
.strip .s span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* ---------- Scan bar ---------- */
.scanbar{padding:14px}
.scanwrap{position:relative;display:flex;gap:8px}
.scaninput{height:58px;font-size:18px;font-weight:600;padding-left:50px;letter-spacing:.01em}
.scanicon{position:absolute;left:16px;top:19px;color:var(--muted)}
.scanhint{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.scanhint .ready{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
.scanhint .ready.idle{color:var(--muted)}
.suggest{position:absolute;left:0;right:0;top:64px;z-index:20;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.12);max-height:360px;overflow:auto}
.sug{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:12px;align-items:center}
.sug:last-child{border-bottom:0}
.sug:hover,.sug.on{background:var(--soft)}
#camBox{margin-top:12px;border-radius:12px;overflow:hidden;background:#000;position:relative}
#camReader{width:100%}
#camReader video{width:100%!important;display:block}
.camclose{position:absolute;top:10px;right:10px;z-index:5}

/* ---------- Material card ---------- */
.matcard{margin-top:14px;overflow:hidden}
.mat-head{padding:20px 20px 14px}
.mat-no{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em;display:flex;gap:12px;flex-wrap:wrap}
.mat-desc{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.two > div{padding:16px 20px}
.two > div + div{border-left:1px solid var(--line)}
.two label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.two b{display:block;font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-top:4px}
.two b small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.prog{padding:14px 20px}
.bar{height:8px;border-radius:99px;background:#f0efed;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .4s}
.bar.ok > i{background:var(--ok)}
.bar.warn > i{background:#d97706}
.prog .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink2);white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.status.full{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.status.full::before{background:var(--ok)}
.status.part{background:var(--warnbg);border-color:var(--warnline);color:var(--warn)}
.status.part::before{background:#d97706}
.banner{margin:0 20px 14px;padding:12px 14px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warnbg);border:1px solid var(--warnline);color:#78350f}
.banner.ok{background:var(--okbg);border:1px solid var(--okline);color:#14532d}
.banner.bad{background:var(--badbg);border:1px solid var(--badline);color:#7f1d1d}
.takers{padding:0 20px 14px}
.taker{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
.taker:first-child{border-top:0}
.pickform{padding:16px 20px 20px;background:var(--soft);border-top:1px solid var(--line)}
.qtyrow{display:flex;gap:8px;align-items:stretch}
.qtybtn{width:54px;height:54px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-size:24px;font-weight:600}
.qtyinput{height:54px;text-align:center;font-size:24px;font-weight:800;flex:1;min-width:0}
.quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{padding:46px 20px;text-align:center;color:var(--muted)}
.empty .big{width:64px;height:64px;border-radius:18px;border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--ink)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:17px}

/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:#fff}
.li:first-child{border-top:0}
.li:hover{background:var(--soft)}
.li .t{font-weight:600;line-height:1.3}
.li .s{font-size:12px;color:var(--muted);font-family:var(--mono);margin-bottom:2px}
.li .r{text-align:right;flex:none}
.li .r b{font-size:18px;display:block;letter-spacing:-.02em}
.li .r span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;padding:3px;background:#fff;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}

/* ---------- Bottom nav (mobile users) ---------- */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:none;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.bnav button.on{color:var(--ink)}
.bnav svg.i{width:22px;height:22px}

/* ---------- Admin ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.kpi small{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{height:40px;width:auto;min-width:0}
.toolbar .search{flex:1;min-width:200px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.desc{min-width:240px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.drop{border:2px dashed var(--line2);border-radius:16px;padding:40px 20px;text-align:center;background:#fff;transition:border .15s,background .15s;cursor:pointer}
.drop.over{border-color:var(--ink);background:var(--soft)}
.feed .fi{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.feed .fi:first-child{border-top:0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.exp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.exp .card{padding:18px;display:flex;flex-direction:column;gap:10px}
.exp h4{margin:0;font-size:15px}
.exp p{margin:0;color:var(--muted);font-size:13px;flex:1}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .18s}
.modal.wide{max-width:720px}
.modal-h{padding:20px 22px 0;display:flex;gap:14px;align-items:flex-start}
.modal-h h3{margin:0;font-size:18px;letter-spacing:-.01em}
.modal-b{padding:14px 22px}
.modal-f{padding:6px 22px 22px;display:flex;gap:8px;justify-content:flex-end}
.micon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--soft);border:1px solid var(--line)}
.micon.warn{background:var(--warnbg);border-color:var(--warnline);color:var(--warn)}
.micon.bad{background:var(--badbg);border-color:var(--badline);color:var(--bad)}
.micon.ok{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full{grid-column:1/-1}

/* ---------- Toast ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:440px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:500;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:pop .2s;width:100%}
.toast.ok{background:#14532d}
.toast.bad{background:#7f1d1d}
.toast.warn{background:#78350f}

/* ---------- Loading ---------- */
#loader{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:150;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:600}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--ink);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .exp{grid-template-columns:1fr}
}
@media (max-width:640px){
  html,body{font-size:14.5px}
  .bnav.show{display:flex}
  .utabs{display:none}
  .topbar-in{padding:8px 12px;gap:8px}
  .brand small{display:none}
  .brand > div:last-child{display:none}
  #liveTxt{display:none}
  .scaninput{font-size:16px;padding-left:44px}
  .scanicon{left:13px}
  .userchip .uname{display:none}
  .strip{grid-template-columns:repeat(4,1fr);gap:6px}
  .strip .s{padding:8px}
  .strip .s b{font-size:17px}
  .strip .s span{font-size:10px}
  .mat-desc{font-size:19px}
  .two b{font-size:34px}
  .two > div{padding:14px 16px}
  .mat-head,.prog{padding-left:16px;padding-right:16px}
  .banner{margin-left:16px;margin-right:16px}
  .takers,.pickform{padding-left:16px;padding-right:16px}
  .kpi b{font-size:24px}
  .formgrid{grid-template-columns:1fr}
  main{padding:12px 12px 100px}
  .kv{grid-template-columns:120px 1fr}
}

/* ---------- v3: tasks & categories ---------- */
.cattag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line2);background:#fff;color:var(--ink2);font-family:var(--mono)}
.cattag.MED{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
.cattag.COS{background:#fdf2f8;border-color:#fbcfe8;color:#831843}
.cattag.MIL{background:#f0fdfa;border-color:#99f6e4;color:#134e4a}
.cattag.DIP{background:#faf5ff;border-color:#e9d5ff;color:#581c87}
.tasktag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--ink);color:#fff}
.tasktag.Backup{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.catbadge{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid var(--line2);background:#fff}
.catbadge.MED{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}.catbadge.COS{background:#fdf2f8;border-color:#fbcfe8;color:#831843}
.catbadge.MIL{background:#f0fdfa;border-color:#99f6e4;color:#134e4a}.catbadge.DIP{background:#faf5ff;border-color:#e9d5ff;color:#581c87}
#tbTask{background:var(--ink);color:#fff;border-color:var(--ink);cursor:pointer}
#tbTask.backup{background:#fff;color:var(--ink);border-color:var(--ink)}
.taskcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow);transition:border .15s,transform .05s}
.taskcard:hover{border-color:var(--ink)}
.taskcard:active{transform:scale(.99)}
.taskcard.main{border:2px solid var(--ink)}
.taskcard.cur{box-shadow:0 0 0 3px rgba(10,10,10,.12)}

<script>
/* =====================================================================
   OVERSTOCK FINDER v3 — client  (one app per pharmacy · Core & Backup tasks)
   ===================================================================== */
const POLL_MS = 3000;
const PAGE = 50;
const ST = { NONE:'Not Taken', PART:'Partially Taken', FULL:'Fully Taken' };
const TASKS = ['Core','Backup'];
const TASK_LABEL = { Core:'Task 1 · Core', Backup:'Task 2 · Backup' };
const CATS = ['MED','COS','MIL','DIP'];
const CAT_NAME = { MED:'Medicine', COS:'Cosmetics', MIL:'Milk', DIP:'Diapers', OTH:'Other', ALL:'All categories' };
const CAT_DIGIT = { '1':'MED', '2':'COS', '3':'MIL', '4':'DIP' };
const catOf = m => CAT_DIGIT[String(m||'').trim().replace(/^0+/,'').charAt(0)] || 'OTH';

/* ↓↓↓ For the GitHub version: the Apps Script web-app link of THIS pharmacy ↓↓↓ */
const API_URL = window.OSF_API_URL || 'https://script.google.com/macros/s/AKfycbyW4_MpGjC8m_RkFShEi1Esr9JVJsGvURGX_qJLvH2NxTVz9bwT8rskGZnnu3ABM1JqTA/exec';
const APP_KEY = window.OSF_APP_KEY || ((location.pathname.match(/p\d{3,4}/i) || ['app'])[0].toLowerCase());

const S = {
  token:null, user:null, role:null, cat:null, name:null,
  task:null, data:null, mv:null, pv:null,
  mats:[], picks:[], byKey:new Map(), byCode:new Map(), byMat:new Map(),
  view:'scan', current:null, lastScan:'', searchQ:'', searchF:'open', searchN:60,
  histSeg:'picks', myScans:[], polling:false, pollTimer:null, online:true,
  adm:{ view:'dash', mt:'Core', mq:'', mf:'all', mc:'all', mu:'all', mp:0, pt:'all', pc:'all', pq:'', pu:'all', pp:0, sq:'', su:'all', sp:0, scans:null, upload:null, userRows:null }
};

/* ---------------- Utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').trim().replace(/\s+/g,'').replace(/^0+/,'').toUpperCase();
const fmtN = n => Number(n||0).toLocaleString('en-US');
const pad2 = n => String(n).padStart(2,'0');
function fmtTime(ms){ if(!ms) return '—'; const d=new Date(ms); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fmtDT(ms){ if(!ms) return '—'; const d=new Date(ms); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+fmtTime(ms); }
function ago(ms){ if(!ms) return '—'; const s=Math.round((Date.now()-ms)/1000); if(s<45) return 'just now'; if(s<3600) return Math.round(s/60)+' min ago'; if(s<86400) return Math.round(s/3600)+' h ago'; return fmtDT(ms); }
const isToday = ms => { const d=new Date(ms), n=new Date(); return d.toDateString()===n.toDateString(); };
const stClass = st => st===ST.FULL?'full':st===ST.PART?'part':'';
const stShort = st => st===ST.FULL?'Fully taken':st===ST.PART?'Partially taken':'Not taken';

const store = {
  k: x => 'osf3_' + APP_KEY + '_' + x,
  get(x){ try{ return JSON.parse(localStorage.getItem(this.k(x))); }catch(e){ return null; } },
  set(x,v){ try{ localStorage.setItem(this.k(x), JSON.stringify(v)); }catch(e){} },
  del(x){ try{ localStorage.removeItem(this.k(x)); }catch(e){} }
};

const I = {
  scan:'<svg class="i" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>',

  cam:'<svg class="i" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  kb:'<svg class="i" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>',
  warn:'<svg class="i" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  ok:'<svg class="i" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',

  dash:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  box:'<svg class="i" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>',
  list:'<svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',

  down:'<svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>',

  eye:'<svg class="i" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  user:'<svg class="i" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  refresh:'<svg class="i" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>'
};


/* ---------------- Server bridge ----------------
   1) Opened from the Apps Script link → google.script.run
   2) Opened from GitHub Pages         → POST to API_URL
   ------------------------------------------------- */
const IN_GAS = !!(window.google && google.script && google.script.run);
function apiFail(msg){
  if (String(msg).includes('AUTH_EXPIRED')) { toast('Session expired. Please sign in again.','warn'); logout(true); }
  return new Error(String(msg).replace(/^Error:\s*/,'').replace(/^Exception:\s*/,''));
}
function api(fn, ...args){
  if (IN_GAS){
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve)
        .withFailureHandler(err => reject(apiFail((err && err.message) || err)))[fn](...args);
    });
  }
  if (API_URL.indexOf('%%')===0) return Promise.reject(new Error('This page is not connected yet: the Apps Script link is missing.'));
  const call = () => fetch(API_URL, { method:'POST', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) })
    .then(r => { if (!r.ok) throw new Error('NET'); return r.json(); });
  const readOnly = /^(get|login|appInfo|adminGet)/.test(fn);
  return call()
    .catch(e => readOnly ? new Promise(r => setTimeout(r, 800)).then(call) : Promise.reject(e))
    .catch(() => { throw new Error('No connection to server. Check internet and try again.'); })
    .then(j => { if (!j.ok) throw apiFail(j.error); return j.result; });
}
function loading(on, txt){ $('#loader').classList.toggle('hidden', !on); $('#loaderTxt').textContent = txt || 'Loading…'; }

/* ---------------- Feedback (sound / vibrate / toast) ---------------- */
let actx = null;
function tone(freq, dur, when=0, type='sine', vol=.08){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime + when; o.start(t); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.stop(t+dur+.02);
  }catch(e){}
}
const sfx = {
  scan(){ tone(1320,.07); },
  ok(){ tone(880,.09); tone(1320,.12,.09); try{navigator.vibrate&&navigator.vibrate(40);}catch(e){} },
  warn(){ tone(520,.16,0,'triangle',.12); tone(520,.16,.2,'triangle',.12); try{navigator.vibrate&&navigator.vibrate([80,60,80]);}catch(e){} },
  bad(){ tone(220,.25,0,'square',.05); try{navigator.vibrate&&navigator.vibrate(200);}catch(e){} }
};
function toast(msg, kind='', ms=2600){
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = (kind==='ok'?I.ok:kind==='bad'?I.x:kind==='warn'?I.warn:I.info) + '<div>' + msg + '</div>';
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, ms);
}

/* ---------------- Modals ---------------- */
function modalOpen(){ return !!document.querySelector('.overlay'); }
function openModal(html, opts={}){
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="modal '+(opts.wide?'wide':'')+'">'+html+'</div>';
  ov.addEventListener('mousedown', e => { if(e.target===ov && !opts.sticky) closeModal(); });
  document.body.appendChild(ov);
  const f = ov.querySelector('[autofocus]') || ov.querySelector('.modal-f .btn:last-child');
  if (f) setTimeout(() => { f.focus(); if (f.select) f.select(); }, 30);
  return ov;
}
function closeModal(){ document.querySelectorAll('.overlay').forEach(o => o.remove()); if (S.role==='user') setTimeout(focusScan, 30); }
function confirmBox(title, msg, okLabel='Confirm', danger=false){
  return new Promise(res => {
    const ov = openModal(`
      <div class="modal-h"><div class="micon ${danger?'bad':''}">${danger?I.warn:I.info}</div><div><h3>${title}</h3></div></div>
      <div class="modal-b">${msg}</div>
      <div class="modal-f"><button class="btn ghost" data-a="no">Cancel</button><button class="btn ${danger?'danger':''}" data-a="yes">${okLabel}</button></div>`);
    ov.querySelector('[data-a=no]').onclick = () => { closeModal(); res(false); };
    ov.querySelector('[data-a=yes]').onclick = () => { closeModal(); res(true); };
  });
}
document.addEventListener('keydown', e => { if (e.key==='Escape' && modalOpen()) closeModal(); });

/* =====================================================================
   DATA
   ===================================================================== */
I.swap = '<svg class="i" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>';
const keyOf = (task, m) => task + '|' + norm(m);
function ingest(data){
  const prevMats = S.matsRaw;
  if (data.materials) S.matsRaw = data.materials;
  S.data = Object.assign({}, S.data || {}, data);
  if (!data.materials) S.data.materials = prevMats;
  S.mv = data.mv; S.pv = data.pv;
  if (data.me && S.role==='user') S.cat = data.me.cat;
  const raw = S.matsRaw || [];
  const byKey = new Map(), byCode = new Map(), byMat = new Map();
  const mats = raw.map(r => ({ task:r[0], m:r[1], d:r[2], oh:r[3], os:r[4], bc:r[5], cat:catOf(r[1]), picks:[], taken:0, rem:0, status:ST.NONE, takers:[], lastTs:0 }));
  const push = (map, k, o) => { if (!k) return; const a = map.get(k); if (a) a.push(o); else map.set(k, [o]); };
  mats.forEach(o => { o.k = keyOf(o.task, o.m); byKey.set(o.k, o); push(byCode, norm(o.bc), o); push(byMat, norm(o.m), o); });
  const picks = (data.picks || []).map(p => ({ id:p[0], ts:p[1], task:p[2], m:p[3], user:p[4], qty:p[5], eb:p[6], ea:p[7] }));
  picks.forEach(p => { const o = byKey.get(keyOf(p.task, p.m)); if (o){ o.picks.push(p); p.o = o; } });
  mats.forEach(o => {
    o.picks.sort((a,b) => a.ts-b.ts);
    const by = {};
    o.picks.forEach(p => { o.taken += p.qty; by[p.user] = (by[p.user]||0) + p.qty; o.lastTs = Math.max(o.lastTs, p.ts); });
    o.takers = Object.keys(by).map(u => ({ user:u, qty:by[u], last:Math.max(...o.picks.filter(p=>p.user===u).map(p=>p.ts)) }));
    o.rem = Math.max(0, o.os - o.taken);
    o.status = o.taken<=0 ? ST.NONE : (o.taken>=o.os ? ST.FULL : ST.PART);
  });
  picks.sort((a,b) => b.ts-a.ts);
  S.mats = mats; S.picks = picks; S.byKey = byKey; S.byCode = byCode; S.byMat = byMat;
}
/** Picker scope: chosen task + own category (OTH items are open to everyone) */
const inMyCat = o => S.role!=='user' || S.cat==='ALL' || o.cat===S.cat || o.cat==='OTH';
const inScope = o => o.task===S.task && inMyCat(o);
const scopeMats = () => S.mats.filter(inScope);
function findAll(q){ const n = norm(q); if (!n) return []; return (S.byCode.get(n) || []).concat((S.byMat.get(n) || []).filter(o => !(S.byCode.get(n)||[]).includes(o))); }
function findMat(q){ const all = findAll(q); return all.find(inScope) || all[0] || null; }

/* ---------- Barcode / QR / GS1 DataMatrix decoding ----------
   Pharma QR / DataMatrix codes hold several values in one string, e.g.
   ]d2 01 07640153087850 17 271231 10 BATCH 21 SERIAL  (or "(01)…(17)…").
   We pull out the product code (GTIN, AI 01) and match only that.        */
function scanCandidates(raw){
  let s = String(raw||'').replace(/[\r\n\t]/g,'').trim();
  s = s.replace(/^\][A-Za-z]\d/, '');                        // symbology id: ]d2 ]Q3 ]C1 ]e0
  const out = [];
  const add = (c, how) => { c = String(c||'').trim(); if (c && !out.some(x => x.c===c)) out.push({ c, how }); };
  add(s, 'direct');
  const clean = s.replace(/[\u001d\u001e\u0004]/g, '|');     // GS / RS / EOT separators
  let m;
  if ((m = clean.match(/\/01\/(\d{8,14})/))) add(m[1], 'gs1');          // GS1 Digital Link URL
  if ((m = clean.match(/\(01\)\s*(\d{14})/))) add(m[1], 'gs1');         // (01)GTIN human readable
  if ((m = clean.match(/(?:^|\|)0[12](\d{14})/))) add(m[1], 'gs1');     // raw element string 01/02 + GTIN
  if ((m = clean.match(/\(02\)\s*(\d{14})/))) add(m[1], 'gs1');         // contained GTIN
  clean.split(/[^0-9A-Za-z\-]+/).forEach(t => { if (t.length >= 4) add(t, 'token'); });
  return out;
}
function resolveScan(raw){
  const cands = scanCandidates(raw);
  for (const x of cands){ const all = findAll(x.c); if (all.length) return { all, o: all.find(inScope) || all[0], code:x.c, how:x.how, cands }; }
  for (const run of String(raw||'').split(/\D+/)){
    if (run.length < 12) continue;
    for (const L of [14,13,12]) for (let i=0; i+L<=run.length; i++){
      const sub = run.substr(i, L); const all = S.byCode.get(norm(sub));
      if (all) return { all, o: all.find(inScope) || all[0], code:sub, how:'embedded', cands };
    }
  }
  const g = cands.find(x => x.how==='gs1');
  return { all:[], o:null, code: g ? g.c : (cands[0] ? cands[0].c : ''), how: g ? 'gs1' : 'none', cands };
}
const isCodeLike = q => /[\u001d\u001e()\]\/]/.test(q) || (/^\S+$/.test(q) && q.length > 16) || /^\d{6,}$/.test(q);

function searchList(list, q, filter='all', limit=Infinity){
  const words = String(q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const out = [];
  for (const o of list){
    if (filter==='none' && o.status!==ST.NONE) continue;
    if (filter==='part' && o.status!==ST.PART) continue;
    if (filter==='full' && o.status!==ST.FULL) continue;
    if (filter==='open' && o.status===ST.FULL) continue;
    if (words.length){ const hay = (o.m+' '+o.bc+' '+o.d).toLowerCase(); if (!words.every(w => hay.includes(w))) continue; }
    out.push(o); if (out.length>=limit) break;
  }
  return out;
}
function totalsOf(list){
  const t = { items:list.length, os:0, taken:0, rem:0, full:0, part:0, none:0 };
  list.forEach(o => { t.os+=o.os; t.taken+=Math.min(o.taken,o.os); t.rem+=o.rem; if(o.status===ST.FULL)t.full++; else if(o.status===ST.PART)t.part++; else t.none++; });
  t.pct = t.os ? Math.round(t.taken/t.os*1000)/10 : 0;
  return t;
}

function setLive(on){

async function refresh(silent=true, needMats){
  const data = await api('getData', S.token, needMats !== false);
  applyData(data, silent);
}
function applyData(data, silent=true){
  const prevCur = S.current ? S.byKey.get(S.current) : null;
  const prevTaken = prevCur ? prevCur.taken : null;
  const prevIds = prevCur ? new Set(prevCur.picks.map(p => p.id)) : null;
  const prevFile = S.data && S.data.uploadedAt;
  ingest(data);
  renderHeader();
  if (silent && prevFile && data.uploadedAt && prevFile !== data.uploadedAt){
    toast('A new overstock list was uploaded by the admin','warn',4000);
    S.current = null;
  }
  if (silent && S.role==='user' && S.current){
    const o = S.byKey.get(S.current);
    if (o && prevTaken!==null && o.taken !== prevTaken){
      const fresh = o.picks.filter(p => !prevIds.has(p.id) && p.user!==S.user);
      if (fresh.length){ toast(esc(fresh[0].user)+' just picked '+fresh[0].qty+' pc of this material','warn',3500); sfx.warn(); }
    }
  }
  if (silent && S.role==='admin' && ['upload','settings','export','users'].includes(S.adm.view)) { renderNav(); return; }
  rerender();
}
function startPolling(){ stopPolling(); S.pollTimer = setInterval(poll, POLL_MS); }
function stopPolling(){ if (S.pollTimer) clearInterval(S.pollTimer); S.pollTimer = null; }
async function poll(){
  if (S.polling || !S.token || document.hidden) return;
  S.polling = true;
  try{
    const v = String(await api('getVersion', S.token)).split('|');
    setLive(true);
    if (v[0] !== String(S.mv)) await refresh(true, true);
    else if (v[1] !== String(S.pv)) await refresh(true, false);
  }catch(e){ setLive(false); }
  finally{ S.polling = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

async function confirmPick(){
  const o = S.byKey.get(S.current); if (!o) return;
  const qi = $('#qtyInput'); const btn = $('#btnPick');
  const qty = parseInt(qi && qi.value, 10);
  if (!(qty>0)){ toast('Enter the quantity you picked','bad'); sfx.bad(); qi && qi.focus(); return; }
  if (qty > o.rem){ toast('Only '+o.rem+' pc remaining for this material','bad'); sfx.bad(); qi.value=o.rem; qi.select(); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin" style="width:18px;height:18px;border-width:2px;border-top-color:#fff"></span>Saving…';
  try{
    const r = await api('submitPick', S.token, o.task, o.m, qty);
    if (r.ok && qi) qi.blur();
    applyData(r.data, false);
    const n = S.byKey.get(o.k);
    if (r.ok){
      sfx.ok();
      if (n.status===ST.FULL) toast('Picked '+qty+' pc · <b>Full quantity taken</b>','ok');
      else toast('Picked '+qty+' pc · Partially taken — '+n.rem+' pc still needed','ok',3200);
      focusScan();
    } else if (r.code==='FULL'){ showFullWarning(n); }
    else if (r.code==='EXCEEDS'){
      sfx.warn();
      openModal(`<div class="modal-h"><div class="micon warn">${I.warn}</div><div><h3>Quantity changed</h3></div></div>
        <div class="modal-b">Someone just picked this material. Only <b>${n.rem} pc</b> remain now (taken by ${n.takers.map(t=>esc(t.user)+' ('+t.qty+')').join(', ')}). Please re-enter your quantity.</div>
        <div class="modal-f"><button class="btn" id="exOk">OK</button></div>`).querySelector('#exOk').onclick = () => { closeModal(); setTimeout(()=>{ const q=$('#qtyInput'); if(q){ q.focus(); q.select(); } },60); };
    }
  }catch(e){ toast(esc(e.message),'bad',4000); sfx.bad(); }
  finally{ const b=$('#btnPick'); if(b){ b.disabled=false; b.innerHTML=I.ok+'Confirm pick'; } }
}

  $('#btnKb').classList.toggle('on', on);

function focusScan(){
  if (S.role!=='user' || S.view!=='scan' || modalOpen()) return;
  const si = $('#scanInput'); if (!si) return;
  const ae = document.activeElement;
  if (ae && ae!==si && ae.id==='qtyInput') return;

function wireScanInput(){
  const si = $('#scanInput');
  si.addEventListener('keydown', e => {
    const sg = $('#suggest');
    if (e.key==='Enter'){
      e.preventDefault(); clearTimeout(sinp.timer);
      const on = sg && !sg.classList.contains('hidden') && sg.querySelector('.sug.on');
      if (on) { on.click(); return; }
      handleScan(si.value, 'enter');
    } else if ((e.key==='ArrowDown'||e.key==='ArrowUp') && sg && !sg.classList.contains('hidden')){
      e.preventDefault();
      const items = [...sg.querySelectorAll('.sug')]; if (!items.length) return;
      sinp.sugIdx = Math.max(0, Math.min(items.length-1, sinp.sugIdx + (e.key==='ArrowDown'?1:-1)));
      items.forEach((x,i)=>x.classList.toggle('on', i===sinp.sugIdx));
    }
  });
  si.addEventListener('input', () => {
    const now = performance.now();
    if (si.value.length<=1) sinp.first = now;
    sinp.last = now;
    clearTimeout(sinp.timer); clearTimeout(sinp.sugTimer);
    // Auto-detect scanners that do not send Enter: fast burst + 220ms idle
    sinp.timer = setTimeout(() => {
      const v = si.value.trim(); const len = v.length;
      const avg = (sinp.last - sinp.first) / Math.max(1, len-1);
      if (len>=6 && avg<35 && /^[\x21-\x7e\u001d]+$/.test(v)) handleScan(v, 'auto');
    }, 220);
    sinp.sugTimer = setTimeout(renderSuggest, 160);
  });
  si.addEventListener('blur', () => setTimeout(() => { if (!document.activeElement || document.activeElement===document.body) hideSuggest(); }, 150));
  $('#btnCam').onclick = () => S.cam ? stopCamera() : startCamera();
  $('#btnCamClose').onclick = () => stopCamera();
  $('#btnKb').onclick = () => { store.set('kbmode', !kbMode()); applyKbMode(); si.blur(); setTimeout(()=>si.focus(),50); toast(kbMode()?'On-screen keyboard enabled':'Scanner mode: on-screen keyboard hidden'); };
  setTimeout(focusScan, 50);
}
function renderSuggest(){
  const si = $('#scanInput'), sg = $('#suggest'); if (!si||!sg) return;
  const v = si.value.trim();
  const avg = (sinp.last - sinp.first) / Math.max(1, v.length-1);
  if (v.length<2 || (v.length>=6 && avg<35)){ hideSuggest(); return; }
  const res = searchList(scopeMats(), v, 'all', 8);
  sinp.sugIdx = -1;
  if (!res.length){ sg.innerHTML = '<div class="sug muted">No matching '+esc(CAT_NAME[S.cat]||'')+' item in '+esc(S.task)+'</div>'; sg.classList.remove('hidden'); return; }
  sg.innerHTML = res.map(o => `<div class="sug" data-k="${esc(o.k)}"><div class="grow"><div class="mono muted" style="font-size:11.5px">${esc(o.m)} · ${esc(o.bc)}</div><div style="font-weight:600">${esc(o.d)}</div></div><span class="status ${stClass(o.status)}">${o.rem}/${o.os}</span></div>`).join('');
  sg.classList.remove('hidden');
  sg.querySelectorAll('.sug[data-k]').forEach(x => x.onmousedown = x.onclick = (e) => { e.preventDefault(); const o=S.byKey.get(x.dataset.k); si.value=''; hideSuggest(); if(o){ logScanEvt(v,o); openMaterial(o); } });
}
function hideSuggest(){ const sg=$('#suggest'); if(sg){ sg.classList.add('hidden'); sg.innerHTML=''; } }

function handleScan(raw){
  const q = String(raw||'').trim();
  const si = $('#scanInput');
  clearTimeout(sinp.timer);
  if (!q) return;
  if (modalOpen()) closeModal();
  if (si) si.value = '';
  hideSuggest();
  const r = resolveScan(q);
  const shown = r.code || q;
  const fromQr = r.how!=='direct' && shown!==q;
  S.lastScan = shown + (fromQr ? ' (from QR)' : '');
  const ls = $('#lastScan'); if (ls) ls.textContent = 'Last: ' + S.lastScan;
  let o = r.all.find(inScope) || null;
  if (!o && !r.all.length && !isCodeLike(q)){
    const res = searchList(scopeMats(), q, 'all', 50);
    if (res.length===1) o = res[0];
    else if (res.length>1){ S.searchQ = q; S.searchF='all'; setView('search'); return; }
  }
  if (o){ if (S.view!=='scan'){ S.view='scan'; rerender(); } logScanEvt(shown, o); openMaterial(o); return; }
  // Found, but not in this picker's list → explain clearly
  const other = r.all[0];
  if (other){
    sfx.bad();
    const sameCat = inMyCat(other);
    logScanEvt(shown, other, sameCat ? 'In other task ('+other.task+')' : 'Other category ('+other.cat+')');
    const body = sameCat
      ? `This item is in <b>${esc(TASK_LABEL[other.task])}</b>. You are working on <b>${esc(TASK_LABEL[S.task])}</b>.`
      : `This item belongs to the <b>${esc(CAT_NAME[other.cat])}</b> pickers (${esc(other.cat)}). It is not on your ${esc(CAT_NAME[S.cat])} list — leave it for them.`;
    const ov = openModal(`<div class="modal-h"><div class="micon warn">${I.warn}</div><div><h3>${sameCat?'Different task':'Not your category'}</h3><div class="muted" style="font-size:13px">Material ${esc(other.m)}</div></div></div>
      <div class="modal-b"><p style="margin:0 0 10px"><b>${esc(other.d)}</b></p>${body}</div>
      <div class="modal-f">${sameCat?`<button class="btn ghost" id="otSwitch">Switch to ${esc(other.task)}</button>`:''}<button class="btn" id="otOk">OK, scan next</button></div>`);
    ov.querySelector('#otOk').onclick = closeModal;
    const sw = ov.querySelector('#otSwitch');
    if (sw) sw.onclick = () => { closeModal(); S.task = other.task; saveSession(); renderHeader(); S.view='scan'; rerender(); openMaterial(other); };
    return;
  }
  sfx.bad();
  logScanEvt(shown, null);
  openModal(`<div class="modal-h"><div class="micon bad">${I.x}</div><div><h3>Not in overstock list</h3></div></div>
    <div class="modal-b"><div class="mono" style="font-size:16px;font-weight:600;margin-bottom:4px">${esc(shown)}</div>${fromQr?`<div class="muted mono" style="font-size:11.5px;word-break:break-all;margin-bottom:8px">Read from QR: ${esc(q.replace(/[\u001d]/g,' '))}</div>`:'<div style="height:6px"></div>'}This barcode / material is not in the Core or Backup list for pharmacy <b>${esc(S.data&&S.data.pharmacy)}</b>. Put it back and scan the next item.</div>
    <div class="modal-f"><button class="btn block" id="nfOk">OK, scan next</button></div>`).querySelector('#nfOk').onclick = closeModal;
}
function logScanEvt(q, o, resultOverride){
  const result = resultOverride || (!o ? 'Not found' : (o.status===ST.FULL ? 'Already fully taken' : o.status===ST.PART ? 'Partially taken ('+o.rem+' left)' : 'Found'));
  const rec = [Date.now(), S.task, q, o?o.m:'', o?o.d:'', result];
  S.myScans.unshift(rec); S.myScans = S.myScans.slice(0,300);
  store.set('scans_'+S.user, S.myScans);
  api('logScan', S.token, S.task, q, o?o.m:'', o?o.d:'', result).catch(()=>{});
}

/* Global keyboard-wedge listener: catches scanner bursts even when focus is elsewhere */
const kb = { buf:'', first:0, last:0, target:null, snap:null, timer:null };
const isEditable = el => el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.tagName==='SELECT' || el.isContentEditable);
document.addEventListener('keydown', e => {
  if (S.role!=='user' || !S.token) return;
  const t = e.target;
  if (t && t.id==='scanInput') return;
  const now = performance.now();
  if (e.key && e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){
    if (now - kb.last > 60){ kb.buf=''; kb.first=now; kb.target=t; kb.snap = (t && 'value' in t) ? t.value : null; }
    kb.buf += e.key; kb.last = now;
    clearTimeout(kb.timer);
    // Scanners that send no Enter: fast burst of 6+ chars followed by silence
    kb.timer = setTimeout(() => {
      const len = kb.buf.length, avg = (kb.last - kb.first) / Math.max(1, len-1);
      if (len>=6 && avg<35){
        const code = kb.buf; kb.buf='';
        if (kb.target && kb.snap!==null && 'value' in kb.target) kb.target.value = kb.snap;
        handleScan(code, 'scanner');
      }
    }, 220);
    if (!isEditable(t) && !modalOpen() && S.view==='scan'){
      e.preventDefault(); const si=$('#scanInput');
      if (si){ si.focus(); si.value += e.key; si.dispatchEvent(new Event('input')); }
      kb.buf='';
    }
  } else if (e.key==='Enter'){
    clearTimeout(kb.timer);
    if (kb.buf.length>=5 && now - kb.last < 100){
      e.preventDefault(); e.stopPropagation();
      const code = kb.buf; kb.buf='';
      if (kb.target && kb.snap!==null && kb.target===t && 'value' in t) t.value = kb.snap;
      handleScan(code, 'scanner');
      return;
    }
    kb.buf='';
  }
}, true);
document.addEventListener('click', e => {
  if (S.role==='user' && S.view==='scan' && !isEditable(e.target) && !e.target.closest('button,a,.sug,.overlay')) setTimeout(focusScan, 10);
});

/* ---------------- Camera scanning ---------------- */
async function startCamera(){
  if (typeof Html5Qrcode==='undefined'){ toast('Camera scanner library could not load','bad'); return; }
  $('#camBox').classList.remove('hidden'); $('#btnCam').classList.add('on');
  const F = Html5QrcodeSupportedFormats;
  try{
    S.cam = new Html5Qrcode('camReader', { formatsToSupport:[F.EAN_13,F.EAN_8,F.CODE_128,F.CODE_39,F.UPC_A,F.UPC_E,F.ITF,F.QR_CODE,F.DATA_MATRIX], experimentalFeatures:{ useBarCodeDetectorIfSupported:true }, verbose:false });
    let lastCode='', lastAt=0;
    await S.cam.start({ facingMode:'environment' }, { fps:12, qrbox:(w,h)=>({ width:Math.floor(Math.min(w*0.8,320)), height:Math.floor(Math.min(h*0.7,240)) }), aspectRatio:1.333 },
      code => {
        const now = Date.now();
        if (modalOpen()) return;
        if (code===lastCode && now-lastAt<3000) return;
        const o = resolveScan(code).o;
        if (o && S.current===o.k && now-lastAt<6000) return;
        lastCode=code; lastAt=now;
        handleScan(code,'camera');
      }, () => {});
  }catch(e){
    stopCamera();
    toast('Camera unavailable: '+esc(e.message||e)+'. Allow camera permission, or use the handheld scanner.','bad',6000);
  }
}
function stopCamera(){
  const c = S.cam; S.cam = null;
  const box = $('#camBox'); if (box) box.classList.add('hidden');
  const b = $('#btnCam'); if (b) b.classList.remove('on');
  if (c){ try{ c.stop().then(()=>c.clear()).catch(()=>{}); }catch(e){} }
}

    </div>

  const save = async (val) => {
    const q = parseInt(val,10);
    if (!(q>=0)) { toast('Enter a valid quantity','bad'); return; }
    if (q>max){ toast('Maximum allowed is '+max,'bad'); return; }
    loading(true,'Saving…');
    try{ const r = await api('editPick', S.token, id, q); closeModal(); applyData(r.data,false); toast(q===0?'Pick removed':'Quantity updated','ok'); sfx.ok(); }

  ov.querySelector('#epSave').onclick = () => save(ov.querySelector('#epQty').value);

function pager(total, page, key){
  const pages = Math.max(1, Math.ceil(total/PAGE));
  return `<div class="pager"><span>${fmtN(total)} rows · page ${page+1} of ${pages}</span>
    <span class="row"><button class="btn xs ghost" data-pg="${key}" data-d="-1" ${page<=0?'disabled':''}>‹ Prev</button><button class="btn xs ghost" data-pg="${key}" data-d="1" ${page>=pages-1?'disabled':''}>Next ›</button></span></div>`;
}
function wirePager(fn){
  $('#main').querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { S.adm[b.dataset.pg] += Number(b.dataset.d); fn(); window.scrollTo(0,0); });
}
function keepFocus(id, fn){
  const el = document.getElementById(id); const pos = el ? el.selectionStart : null; const had = document.activeElement===el;
  fn();
  const n = document.getElementById(id); if (n && had){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
}

function cellStr(v){
  if (v===null || v===undefined) return '';
  if (typeof v==='number') return Number.isInteger(v) ? v.toLocaleString('fullwide',{useGrouping:false}) : String(v);
  return String(v).trim();
}
function parseSheetRows(ws){
  const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:true });
  let hi = -1;
  for (let i=0;i<Math.min(15,aoa.length);i++){
    const r = aoa[i].map(x=>String(x).toLowerCase());
    if (r.some(x=>/material/.test(x)) && r.some(x=>/over\s*stock/.test(x))){ hi=i; break; }
  }
  if (hi<0) return null;
  const H = aoa[hi].map(x=>String(x).toLowerCase().replace(/\s+/g,' ').trim());
  const find = fn => H.findIndex(fn);
  const c = {
    ph: find(h=>/pharm|site|branch|plant|store/.test(h) && !/remain/.test(h)),
    m:  find(h=>/material/.test(h) && !/desc/.test(h)),
    d:  find(h=>/desc/.test(h) || /name/.test(h)),
    oh: (()=>{ const a=find(h=>/on\s*hand/.test(h)); return a>=0?a:find(h=>/stock/.test(h)&&!/over/.test(h)); })(),
    os: find(h=>/over\s*stock/.test(h)),
    rm: find(h=>/remain/.test(h)),
    bc: find(h=>/(bar)?code|qr|ean|gtin|upc/.test(h) && !/material/.test(h))
  };
  if (c.m<0 || c.os<0) return null;
  const rows = []; let skipped = 0; const seen = new Set(); let dups = 0;
  for (let i=hi+1;i<aoa.length;i++){
    const r = aoa[i]; const m = cellStr(r[c.m]); if (!m) continue;
    const os = Number(r[c.os]); if (!(os>0)){ skipped++; continue; }
    if (seen.has(norm(m))){ dups++; continue; } seen.add(norm(m));
    const oh = c.oh>=0 ? Number(r[c.oh])||0 : 0;
    rows.push([ c.ph>=0 ? cellStr(r[c.ph]).toUpperCase() : '', m, c.d>=0?cellStr(r[c.d]):'', oh, Math.floor(os), c.rm>=0 && r[c.rm]!=='' ? Number(r[c.rm]) : oh-os, c.bc>=0 ? cellStr(r[c.bc]) : m ]);
  }
  return { rows, skipped, dups };
}
function parseUpload(f){
  if (typeof XLSX==='undefined'){ toast('Excel library could not load','bad'); return; }
  const rd = new FileReader();
  rd.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const names = wb.SheetNames;
      const coreName = names.find(n => /core|main/i.test(n));
      const backName = names.find(n => /back|base|bkp/i.test(n));
      const out = { name:f.name, core:null, backup:null, coreSheet:coreName, backSheet:backName };
      if (coreName) out.core = parseSheetRows(wb.Sheets[coreName]);
      if (backName) out.backup = parseSheetRows(wb.Sheets[backName]);
      if (!coreName && !backName){
        const one = parseSheetRows(wb.Sheets[names[0]]);
        if (!one) throw new Error('No sheet with Material and Overstock columns found.');
        out.single = one; out.singleName = names[0]; out.singleTask = 'Core';
      }
      if ((coreName && !out.core) || (backName && !out.backup)) throw new Error('Could not read the '+(coreName && !out.core ? coreName : backName)+' sheet. It needs Material and Overstock columns.');
      const all = [].concat(out.core?out.core.rows:[], out.backup?out.backup.rows:[], out.single?out.single.rows:[]);
      const phs = {}; all.forEach(r => { if (r[0]) phs[r[0]] = (phs[r[0]]||0)+1; });
      out.pharmacies = Object.keys(phs);
      out.wrong = out.pharmacies.filter(p => p !== S.data.pharmacy);
      S.adm.upload = out;
      drawUploadPreview();
    }catch(err){ toast(esc(err.message),'bad',6000); S.adm.upload=null; $('#upPrev').innerHTML=''; }
  };
  rd.readAsArrayBuffer(f);
}
function catCounts(rows){ const c = {}; rows.forEach(r => { const k = catOf(r[1]); c[k] = (c[k]||0)+1; }); return CATS.concat(c.OTH?['OTH']:[]).map(k => `<span class="cattag ${k}">${k}</span> ${fmtN(c[k]||0)}`).join(' &nbsp; '); }
function drawUploadPreview(){
  const U = S.adm.upload; if (!U) return;
  const ph = S.data.pharmacy;
  const block = (label, set) => set ? `<div class="card" style="box-shadow:none;padding:12px 14px;margin-top:10px">
      <div class="row"><b class="grow">${label}</b><span class="pill">${fmtN(set.rows.length)} items · ${fmtN(set.rows.reduce((a,r)=>a+r[4],0))} pc</span></div>
      <div style="font-size:12.5px;margin-top:8px">${catCounts(set.rows)}</div>
      ${set.skipped||set.dups?`<div class="muted" style="font-size:12px;margin-top:6px">${set.skipped?set.skipped+' rows with 0 overstock skipped. ':''}${set.dups?set.dups+' duplicates removed.':''}</div>`:''}
    </div>` : `<div class="card muted" style="box-shadow:none;padding:12px 14px;margin-top:10px">${label}: sheet not found in file — this list will be emptied.</div>`;
  if (U.wrong.length){

    return;

  $('#upPrev').innerHTML = `

      ${U.single ? `<div style="margin-top:12px"><label class="lbl">This file has one sheet ("${esc(U.singleName)}"). Upload it as:</label>
        <div class="seg"><button class="${U.singleTask==='Core'?'on':''}" data-st="Core">Task 1 · Core</button><button class="${U.singleTask==='Backup'?'on':''}" data-st="Backup">Task 2 · Backup</button></div>
        <div class="muted" style="font-size:12px;margin-top:6px">The other task's list stays as it is.</div></div>` + block('Sheet '+U.singleName, U.single)
        : block('Task 1 · Core ('+esc(U.coreSheet||'—')+')', U.core) + block('Task 2 · Backup ('+esc(U.backSheet||'—')+')', U.backup)}
      <label class="row" style="margin-top:14px;font-size:14px;cursor:pointer"><input type="checkbox" id="upKeep"> Keep existing picks (only when re-uploading corrected quantities for the same day)</label>
      <div class="banner warn" style="margin:14px 0 0">${I.warn}<div>This replaces the active list for all pickers of ${esc(ph)}. Current picks are archived unless you keep them.</div></div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" id="upCancel">Cancel</button><div class="grow"></div><button class="btn" id="upGo">${I.up}Upload</button></div>
    </div>`;
  $('#upPrev').querySelectorAll('[data-st]').forEach(b => b.onclick = () => { U.singleTask = b.dataset.st; drawUploadPreview(); });
  $('#upCancel').onclick = () => { S.adm.upload=null; admUpload(); };
  $('#upGo').onclick = async () => {
    const keep = $('#upKeep').checked;
    const payload = { fileName:U.name, keepPicks:keep };
    if (U.single){ payload[U.singleTask==='Core'?'core':'backup'] = U.single.rows; payload.onlyTask = U.singleTask; }
    else { payload.core = U.core ? U.core.rows : []; payload.backup = U.backup ? U.backup.rows : []; }
    const n = (payload.core||[]).length + (payload.backup||[]).length;
    if (!await confirmBox('Upload '+esc(ph)+' list?', `Core ${fmtN((payload.core||[]).length)} · Backup ${fmtN((payload.backup||[]).length)} items become the active lists for every picker.${keep?'':' Existing picks will be archived.'}`, 'Upload now')) return;
    loading(true, 'Uploading '+fmtN(n)+' materials…');
    try{
      const r = await api('adminUploadData', S.token, payload);
      S.adm.upload = null; applyData(r.data,false);
      toast('Uploaded · Core '+fmtN(r.counts.Core)+' · Backup '+fmtN(r.counts.Backup),'ok',4000);
      S.adm.view='dash'; rerender();
    }catch(e){ toast(esc(e.message),'bad',6000); }
    finally{ loading(false); }
  };
}

const xd = ms => ms ? new Date(ms) : '';
const xm = m => /^\d{1,15}$/.test(m) ? Number(m) : m;
function matSheet(list){
  return [['Task','Pharmacy','Material','Category','Material Description','Barcode','On Hand Stock','Overstock Qty','Picked Qty','Remaining To Pick','Status','Taken By','Last Picked At'],
    ...list.map(o => [o.task, S.data.pharmacy, xm(o.m), o.cat, o.d, o.bc, o.oh, o.os, o.taken, o.rem, o.status, o.takers.map(t=>t.user+' ('+t.qty+')').join(', '), xd(o.lastTs)])];
}
function pickSheet(list){
  return [['Timestamp','Task','User','Pharmacy','Material','Category','Material Description','Barcode','Qty Picked','Material Status','Edited By','Edited At','Pick ID'],
    ...list.map(p => [xd(p.ts), p.task, p.user, S.data.pharmacy, xm(p.m), p.o?p.o.cat:catOf(p.m), p.o?p.o.d:'', p.o?p.o.bc:'', p.qty, p.o?p.o.status:'', p.eb, xd(p.ea), p.id])];
}
function userSheet(){
  return [['User','Category','Picks','Core Qty','Backup Qty','Total Qty','Qty Today','Last Activity'], ...userStats().map(u => [u.user, u.cat, u.picks, u.core, u.backup, u.qty, u.today, xd(u.last)])];
}
function scanSheet(list){
  return [['Timestamp','Task','User','Category','Scanned / Searched','Material','Material Description','Result'], ...list.map(r => [xd(r[0]), r[1], r[2], r[3], r[4], xm(r[5]), r[6], r[7]])];
}
function exportMaterials(list, name){ writeBook([[name.replace(/_/g,' '), matSheet(list)]], name); }
function exportPicks(list, name){ writeBook([['Pick Log', pickSheet(list)]], name); }
function exportScans(list){ writeBook([['Scan Log', scanSheet(list)]], 'Scan_Log'); }
async function exportFull(){
  loading(true, 'Building report…');
  let scans = [];
  try{ scans = await api('getScanLog', S.token, false, 20000); }catch(e){}
  const d = S.data; const T = t => S.mats.filter(o=>o.task===t);
  const line = (label, list) => { const x = totalsOf(list); return [label, x.items, x.os, x.taken, x.rem, x.pct/100, x.full, x.part, x.none]; };
  const summary = [
    ['Overstock Report — Pharmacy ' + d.pharmacy], [],
    ['Generated', new Date()], ['Generated by', S.user], ['Source file', d.fileName], ['Uploaded at', xd(d.uploadedAt)], [],
    ['Section','Items','Qty to scan','Scanned qty','Remaining qty','Progress','Fully taken','Partially taken','Not taken'],
    line('CORE (Task 1)', T('Core')), ...CATS.map(c => line('   Core · '+CAT_NAME[c], T('Core').filter(o=>o.cat===c))),
    line('BACKUP (Task 2)', T('Backup')), ...CATS.map(c => line('   Backup · '+CAT_NAME[c], T('Backup').filter(o=>o.cat===c))),
    line('TOTAL', S.mats)
  ];
  writeBook([
    ['Summary', summary],
    ['Core All', matSheet(T('Core'))], ['Core Remaining', matSheet(T('Core').filter(o=>o.status!==ST.FULL))],
    ['Backup All', matSheet(T('Backup'))], ['Backup Remaining', matSheet(T('Backup').filter(o=>o.status!==ST.FULL))],
    ['Pick Log', pickSheet(S.picks)], ['User Summary', userSheet()], ['Scan Log', scanSheet(scans)]
  ], 'Overstock_Report');
  loading(false);
}
function writeBook(sheets, name){
  if (typeof XLSX==='undefined'){ toast('Excel library could not load','bad'); return; }
  const wb = XLSX.utils.book_new();
  sheets.forEach(([title, aoa]) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates:true, dateNF:'dd-mmm-yyyy hh:mm' });
    const widths = (aoa[0]||[]).map((_,ci) => ({ wch: Math.min(60, Math.max(10, ...aoa.slice(0,300).map(r => String(r[ci] instanceof Date ? '00-000-0000 00:00' : (r[ci]??'')).length + 2))) }));
    ws['!cols'] = widths;
    if (aoa.length>1 && title!=='Summary') ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:aoa.length-1, c:(aoa[0].length-1)} }) };
    XLSX.utils.book_append_sheet(wb, ws, title.slice(0,31));
  });
  const n = new Date();
  const fname = `${S.data.pharmacy||'Overstock'}_${name}_${n.getFullYear()}-${pad2(n.getMonth()+1)}-${pad2(n.getDate())}_${pad2(n.getHours())}${pad2(n.getMinutes())}.xlsx`;
  try{ XLSX.writeFile(wb, fname, { cellDates:true }); toast('Downloaded '+esc(fname),'ok'); }
  catch(e){ toast('Download failed: '+esc(e.message),'bad'); }
}
