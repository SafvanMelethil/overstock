<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overstock Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--muted:#737373;--line:#e7e5e4;--bg:#f5f5f4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.wrap{width:100%;max-width:520px}.mark{width:52px;height:52px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
h1{font-size:26px;letter-spacing:-.02em;margin:18px 0 4px}p{color:var(--muted);margin:0 0 22px}
a.ph{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 4px 16px rgba(0,0,0,.05)}
a.ph:hover{border-color:var(--ink)}a.ph b{font-size:22px;letter-spacing:-.02em}a.ph span{color:var(--muted);font-size:14px}.go{margin-left:auto;font-size:22px}
</style></head><body><div class="wrap"><div class="mark">OS</div><h1>Overstock Finder</h1><p>Choose your pharmacy.</p>

</div></body></html>
